name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build CauldronServer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet
        run: dotnet restore CauldronServer.sln

      - name: Build
        run: dotnet build CauldronServer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CauldronServer.sln --configuration Release --no-build --verbosity normal

      - name: Publish CauldronServer (self-contained)
        run: dotnet publish src/server/CauldronServer/CauldronServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Stage release artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $publish = "src/server/CauldronServer/bin/Release/net8.0/win-x64/publish"
          if (-not (Test-Path "$publish/CauldronServer.exe")) { throw "server publish missing at $publish" }
          Compress-Archive -Path "$publish/*" -DestinationPath "artifacts/Cauldron-Server-Windows-x64-$tag.zip"
          Get-FileHash artifacts/*.zip -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Out-File -FilePath artifacts/checksums.txt -Encoding ascii

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no '## [$version]' section. Add the release section before tagging — a tag without one publishes an empty release body."
          }
          $notes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md section for $version is empty."
          }
          $hostingUrl = "https://www.survivalservers.com/services/game_servers/witchspire/?utm_source=github&utm_medium=release_notes&utm_campaign=cauldronserver-$version"
          $hosting = "`n`n---`n`nHosting: [SurvivalServers.com]($hostingUrl) runs Cauldron for you.`n"
          $body = $notes + $hosting
          $body | Out-File -FilePath release-body.md -Encoding utf8

      - name: Create GitHub release (CauldronServer)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
