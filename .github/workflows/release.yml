name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default. The build job checks the hand-made draft release and the verify job reads it;
# both need contents: write, because GitHub shows a draft release only to callers that can write.
permissions:
  contents: read

jobs:
  build:
    name: Build CauldronServer (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 20
    # The tag reaches the shell only through this variable, always quoted. Git
    # allows $, ( ), ;, & and backticks in a tag name, so the tag is never
    # written into a script line.
    env:
      TAG: ${{ github.ref_name }}

    steps:
      # First step, before anything else runs: refuse any tag that is not a
      # release version. Every tag this repo has published is v and three numbers.
      - name: Check tag
        shell: bash
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "tag ${TAG} is a release version"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Security 2026-11-26: a release must hold the release before it. The previous release tag
      # (every v-and-three-numbers tag counts, pre-releases included) must be in the history of the
      # commit being tagged, or the run stops and names it. Twice a candidate was built on the release
      # before last and would have dropped the last one's fixes.
      - name: The previous release tag is in this commit's history
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' \
            | { cat; printf '%s\n' "${TAG}"; } | sort -u -V \
            | awk -v t="${TAG}" '$0 == t { print p; exit } { p = $0 }')"
          if [ -z "${prev}" ]; then
            echo "no release tag before ${TAG}: nothing to check"
            exit 0
          fi
          if ! git merge-base --is-ancestor "${prev}" "${GITHUB_SHA}"; then
            echo "::error::refusing ${TAG}: the previous release tag ${prev} is not in the history of the commit being tagged; build ${TAG} on ${prev}"
            exit 1
          fi
          echo "the previous release tag ${prev} is in the history of ${GITHUB_SHA}"

      - name: Guard the published source
        shell: bash
        env:
          DENY_PATTERN: ${{ secrets.CAULDRON_DENY_PATTERN }}
        run: |
          # This repo is public. A short deny list guards against terms that must
          # not appear here. The list lives in the repository secret
          # CAULDRON_DENY_PATTERN (one extended regular expression), not in this
          # file: an encoded copy here published the very words it guards. A hit
          # fails the release rather than publishing it, and only the file and
          # line are printed, because CI logs are public.
          #
          # The published-artifact scanner and its workflow carry rule tables as
          # data, so both are excluded.
          BANNED="$(printf '%s' "$DENY_PATTERN" | tr -d '\r\n')"
          if [ -z "$BANNED" ]; then
            echo "::error::the deny list secret CAULDRON_DENY_PATTERN is not set; refusing to release unchecked source"
            exit 1
          fi
          hits="$(grep -rnIE -e "$BANNED" --exclude-dir=.git \
               --exclude=verify-published-artifacts.py --exclude=artifact-scan.yml . | cut -d: -f1,2 || true)"
          if [ -n "$hits" ]; then
            echo "::error::deny-listed term found in the published source (file and line; the term is not shown):"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "clean"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore NuGet
        run: dotnet restore CauldronServer.sln

      - name: Build
        run: dotnet build CauldronServer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CauldronServer.sln --configuration Release --no-build --verbosity normal

      # Proves the published source builds. The output is deliberately NOT
      # attached to the release: this repo carries the supervisor source only,
      # so anything it can zip is a bare publish output with no CauldronServer\
      # folder and no cauldron_host AngelScript mod. Publishing that under the
      # host package's asset name is what put an unusable archive on every
      # release page from v0.1.1 to v0.1.12. The complete host package is built
      # once, in the Cauldron build, and attached to this release from there.
      - name: Publish CauldronServer (self-contained)
        run: dotnet publish src/server/CauldronServer/CauldronServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Verify server version stamp
        shell: pwsh
        run: |
          $tag = $env:TAG
          $version = $tag.TrimStart('v')
          $numeric = ($version -split '-')[0]
          $publish = "src/server/CauldronServer/bin/Release/net10.0/win-x64/publish"
          $exe = [Diagnostics.FileVersionInfo]::GetVersionInfo("$publish/CauldronServer.exe")
          $assembly = [Reflection.AssemblyName]::GetAssemblyName("$publish/CauldronServer.dll").Version.ToString()
          if ($exe.FileVersion -ne "$numeric.0" -or $assembly -ne "$numeric.0" -or -not $exe.ProductVersion.StartsWith($version)) {
            throw "tag $version does not match server exe FileVersion=$($exe.FileVersion), ProductVersion=$($exe.ProductVersion), AssemblyVersion=$assembly - bump Directory.Build.props"
          }

      - name: Check the publish output exists
        shell: pwsh
        run: |
          $publish = "src/server/CauldronServer/bin/Release/net10.0/win-x64/publish"
          if (-not (Test-Path "$publish/CauldronServer.exe")) { throw "server publish missing at $publish" }

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = $env:TAG
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no '## [$version]' section. Add the release section before tagging — a tag without one publishes an empty release body."
          }
          $notes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md section for $version is empty."
          }
          # Release notes are grouped by component across this project, so the
          # body opens with the component heading and the changelog's own
          # Added/Changed/Fixed sections nest under it. Without this the body
          # started at '### Fixed' and had to be hand-edited after every release.
          $hostingUrl = "https://www.survivalservers.com/services/game_servers/witchspire/?utm_source=github&utm_medium=release_notes&utm_campaign=cauldronserver-$version"
          $hosting = "`n`n---`n`nHosting: [SurvivalServers.com]($hostingUrl) runs Cauldron for you.`n"
          $body = "## Server`n`n" + $notes + $hosting
          $body | Out-File -FilePath release-body.md -Encoding utf8

      # The release page is made BY HAND, as a draft, before the tag (Security 2026-11-25), with exactly
      # the body built above from CHANGELOG.md. This repo builds no release file of its own: the Cauldron
      # build fills the draft with the host package. So this step only checks that the one draft is in
      # place: it never creates, publishes or edits a release and never touches Latest. GitHub's look-up
      # of a release by tag answers 404 for a draft, which is why the release action is gone.
      - name: The hand-made draft release is in place (CauldronServer)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rels="$(gh api "repos/${REPO}/releases?per_page=100" --paginate \
            | jq -s --arg t "${TAG}" 'add // [] | map(select(.tag_name == $t))')"
          n="$(jq 'length' <<<"${rels}")"
          if [ "${n}" -ne 1 ]; then
            echo "::error::expected exactly one release for ${TAG} (a draft made by hand first), found ${n}"
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' <<<"${rels}")" != "true" ]; then
            echo "::error::the release for ${TAG} is already published; a tag here only ever meets a hand-made draft"
            exit 1
          fi
          jq -r '.[0].body // ""' <<<"${rels}" > draft-body.md
          same="$(jq -n --rawfile a draft-body.md --rawfile b release-body.md \
            '($a | ltrimstr("﻿") | gsub("\r"; "") | sub("\\s+$"; "")) == ($b | ltrimstr("﻿") | gsub("\r"; "") | sub("\\s+$"; ""))')"
          if [ "${same}" != "true" ]; then
            echo "::error::the draft's text differs from the body built from CHANGELOG.md; fix the draft by hand"
            exit 1
          fi
          others="$(jq -r --arg z "Cauldron-Server-Windows-x64-${TAG}.zip" \
            '.[0].assets[].name | select(. != $z and . != "checksums.txt")' <<<"${rels}")"
          if [ -n "${others}" ]; then
            echo "::error::the draft holds files no release run attaches: ${others}"
            exit 1
          fi
          echo "Draft ${TAG} (release $(jq -r '.[0].id' <<<"${rels}")) is in place; the Cauldron build fills it."

  # Fail-closed backstop. The release page is only correct once the host package
  # is attached to it, and that attachment happens from the Cauldron build. If it
  # never arrives -- a missing cross-publish token, a tag pushed here on its own
  # -- this job fails loudly instead of leaving a release that looks finished and
  # hands self-hosters an archive that cannot open a joinable world.
  verify-bundle:
    name: Verify the host package on the draft
    needs: build
    runs-on: ubuntu-latest
    # Write only because GitHub shows a draft release to writers alone; every step here only reads.
    permissions:
      contents: write
    timeout-minutes: 20
    # As in the first job: the tag reaches the shell only through this variable.
    env:
      TAG: ${{ github.ref_name }}

    steps:
      # First step of this job too, so it never relies on the other job's check.
      - name: Check tag
        shell: bash
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "tag ${TAG} is a release version"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Wait for the host package and verify it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="Cauldron-Server-Windows-x64-${TAG}.zip"

          found=""
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" -R "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
              found=1
              break
            fi
            echo "waiting for $ASSET to be attached to $TAG (attempt $attempt/20)"
            sleep 30
          done

          if [[ -z "$found" ]]; then
            echo "ERROR: $TAG has no $ASSET after 10 minutes." >&2
            echo "       The host package is built in the Cauldron build and attached from there." >&2
            echo "       Check that the cross-publish step ran and had a token." >&2
            exit 1
          fi

          gh release download "$TAG" -R "${{ github.repository }}" -p "$ASSET" -D verify --clobber
          python3 scripts/verify-server-bundle.py "verify/$ASSET"
          if [[ "$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
                | jq -s --arg t "$TAG" '[add // [] | .[] | select(.tag_name == $t and .draft)] | length')" -ne 1 ]]; then
            echo "ERROR: $TAG must still be one unpublished draft after the host package check" >&2
            exit 1
          fi

  # No scan job here: the release stays a draft until it is published by hand, and a read-only
  # scan cannot see a draft. The draft is scanned by hand before it is published; artifact-scan.yml's
  # daily run covers it once published.
