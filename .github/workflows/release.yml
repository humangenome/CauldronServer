name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build CauldronServer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard the published source
        shell: bash
        run: |
          # This repo is public. A short deny list guards against terms that must
          # not appear here — internal hosting references and residue from sibling
          # projects. The list itself is encoded so it does not become a hint.
          # A hit fails the release rather than publishing it.
          BANNED="$(printf '%s' 'R29sZGJlcmd8Z29sZGJlcmd8Z2JlX2Zvcmt8c3RlYW1fYXBpNjR8c3RlYW1fc2V0dGluZ3N8QXV0aGVudGljYXRpb25HcmFwaHxCZWxsd3JpZ2h0fEthcnZlbmlhfE1pc3RPYXNpc3xTdWJuYXV0aWNhfEtyYWZ0b258QmVhY29uU2VydmVyfFBPUlQgRlJPTXxzc3BhbmVsfGItY2RuXC5uZXQ=' | base64 -d)"
          if grep -rInE "$BANNED" --exclude-dir=.git --exclude=release.yml . ; then
            echo "::error::deny-listed term found in the published source"
            exit 1
          fi
          echo "clean"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet
        run: dotnet restore CauldronServer.sln

      - name: Build
        run: dotnet build CauldronServer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CauldronServer.sln --configuration Release --no-build --verbosity normal

      # Proves the published source builds. The output is deliberately NOT
      # attached to the release: this repo carries the supervisor source only,
      # so anything it can zip is a bare publish output with no CauldronServer\
      # folder and no cauldron_host AngelScript mod. Publishing that under the
      # host package's asset name is what put an unusable archive on every
      # release page from v0.1.1 to v0.1.12. The complete host package is built
      # once, in the Cauldron build, and attached to this release from there.
      - name: Publish CauldronServer (self-contained)
        run: dotnet publish src/server/CauldronServer/CauldronServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Verify server version stamp
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $numeric = ($version -split '-')[0]
          $publish = "src/server/CauldronServer/bin/Release/net8.0/win-x64/publish"
          $exe = [Diagnostics.FileVersionInfo]::GetVersionInfo("$publish/CauldronServer.exe")
          $assembly = [Reflection.AssemblyName]::GetAssemblyName("$publish/CauldronServer.dll").Version.ToString()
          if ($exe.FileVersion -ne "$numeric.0" -or $assembly -ne "$numeric.0" -or -not $exe.ProductVersion.StartsWith($version)) {
            throw "tag $version does not match server exe FileVersion=$($exe.FileVersion), ProductVersion=$($exe.ProductVersion), AssemblyVersion=$assembly - bump Directory.Build.props"
          }

      - name: Check the publish output exists
        shell: pwsh
        run: |
          $publish = "src/server/CauldronServer/bin/Release/net8.0/win-x64/publish"
          if (-not (Test-Path "$publish/CauldronServer.exe")) { throw "server publish missing at $publish" }

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## |\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no '## [$version]' section. Add the release section before tagging — a tag without one publishes an empty release body."
          }
          $notes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md section for $version is empty."
          }
          # Release notes are grouped by component across this project, so the
          # body opens with the component heading and the changelog's own
          # Added/Changed/Fixed sections nest under it. Without this the body
          # started at '### Fixed' and had to be hand-edited after every release.
          $hostingUrl = "https://www.survivalservers.com/services/game_servers/witchspire/?utm_source=github&utm_medium=release_notes&utm_campaign=cauldronserver-$version"
          $hosting = "`n`n---`n`nHosting: [SurvivalServers.com]($hostingUrl) runs Cauldron for you.`n"
          $body = "## Server`n`n" + $notes + $hosting
          $body | Out-File -FilePath release-body.md -Encoding utf8

      - name: Create GitHub release (CauldronServer)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Author the release as HumanGenome rather than github-actions[bot].
          # Needs a HumanGenome-owned PAT with Contents: Read and write stored
          # as the repo secret HUMANGENOME_PAT. It is NOT set on this repo yet,
          # so the fallback hands the step GITHUB_TOKEN and the byline stays
          # github-actions[bot] — which is why every release page here up to
          # v0.1.13 reads that way. Adding the secret fixes it with no further
          # change; a release's author cannot be corrected after the fact.
          token: ${{ secrets.HUMANGENOME_PAT || secrets.GITHUB_TOKEN }}

  # Fail-closed backstop. The release page is only correct once the host package
  # is attached to it, and that attachment happens from the Cauldron build. If it
  # never arrives -- a missing cross-publish token, a tag pushed here on its own
  # -- this job fails loudly instead of leaving a release that looks finished and
  # hands self-hosters an archive that cannot open a joinable world.
  verify-bundle:
    name: Verify the published host package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for the host package and verify it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ASSET="Cauldron-Server-Windows-x64-${TAG}.zip"

          found=""
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" -R "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
              found=1
              break
            fi
            echo "waiting for $ASSET to be attached to $TAG (attempt $attempt/20)"
            sleep 30
          done

          if [[ -z "$found" ]]; then
            echo "ERROR: $TAG has no $ASSET after 10 minutes." >&2
            echo "       The host package is built in the Cauldron build and attached from there." >&2
            echo "       Check that the cross-publish step ran and had a token." >&2
            exit 1
          fi

          gh release download "$TAG" -R "${{ github.repository }}" -p "$ASSET" -D verify --clobber
          python3 scripts/verify-server-bundle.py "verify/$ASSET"
